[package]
name = "larder-server-infrastructure"
description = "Adapters of the Larder server: SQLite (sqlx), Argon2, JWT."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
larder-server-domain.workspace = true
larder-server-application.workspace = true
async-trait.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.5"
jsonwebtoken = "9"
