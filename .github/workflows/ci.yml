name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the container image
        run: docker build -t larder-server .
      - name: Start it and check /health
        run: |
          docker run -d --name larder -p 8080:8080 larder-server
          for i in $(seq 1 30); do
            curl -fsSk https://127.0.0.1:8080/health && docker logs larder | grep "certificate fingerprint" && exit 0
            sleep 1
          done
          docker logs larder
          exit 1
