[workspace]
resolver = "3"
members = ["crates/api-types", "crates/domain", "crates/application", "crates/infrastructure", "crates/server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
larder-api-types = { path = "crates/api-types" }
larder-server-domain = { path = "crates/domain" }
larder-server-application = { path = "crates/application" }
larder-server-infrastructure = { path = "crates/infrastructure" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
